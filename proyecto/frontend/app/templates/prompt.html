{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <h2>Chat con LlamaChat</h2>
    <div id="chat-box" class="border p-3 mb-3" style="height: 300px; overflow-y: scroll; background: #f8f9fa;"></div>
    <form id="chat-form">
        <div class="input-group">
            <input type="text" id="user-message" class="form-control" placeholder="Escribe un mensaje...">
            <button class="btn btn-primary" type="submit">Enviar</button>
        </div>
    </form>
</div>

<script>
    document.getElementById('chat-form').addEventListener('submit', function(event) {
        event.preventDefault();
        let message = document.getElementById('user-message').value;
        let chatBox = document.getElementById('chat-box');
        chatBox.innerHTML += `<p><strong>Tú:</strong> ${message}</p>`;
        document.getElementById('user-message').value = '';
    
        // Enviar mensaje al backend
        // con solo /prompt se hace la solucitud al frontend, hay que poner el contenedor de API REST /Service/api
        fetch('/Service/prompt', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ prompt: message })
        })
        .then(response => {
            if (!response.ok) throw new Error("No se pudo enviar el prompt");
            return response.json();
        })
        .then(answer => {
            chatBox.innerHTML += `<p><strong>🦙:</strong> ${answer.answer}</p>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        })
        .catch(error => {
            chatBox.innerHTML += `<p><strong>🦙:</strong> :( ${error.message}</p>`;
        });
    });
    
    </script>
{% endblock %}
