{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <h2>Chat con LlamaChat</h2>
    <div id="chat-box" class="border p-3 mb-3" style="height: 300px; overflow-y: scroll; background: #f8f9fa;"></div>
    <form id="chat-form">
        <div class="input-group">
            <input type="text" id="user-message" class="form-control" placeholder="Escribe un mensaje...">
            <button class="btn btn-primary" type="submit">Enviar</button>
        </div>
    </form>
</div>

<script>
    document.getElementById('chat-form').addEventListener('submit', function(event) {
        event.preventDefault();
        let message = document.getElementById('user-message').value;
        let chatBox = document.getElementById('chat-box');
        chatBox.innerHTML += `<p><strong>Tú:</strong> ${message}</p>`;
        document.getElementById('user-message').value = '';
    
        // Enviar mensaje al backend
        // con solo /prompt se hace la solucitud al frontend, hay que poner el contenedor de API REST /Service/api
        fetch('/prompt', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ prompt: message })
        })
        .then(response => {
            if (!response.ok) throw new Error("No se pudo enviar el prompt");
            const location = response.headers.get("Location");  // /response/<token>
            return pollForResponse(location);
        })
        .then(answer => {
            chatBox.innerHTML += `<p><strong>🦙:</strong> ${answer}</p>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        })
        .catch(error => {
            chatBox.innerHTML += `<p><strong>🦙:</strong> :( ${error.message}</p>`;
        });
    });
    
    // Polling para obtener la respuesta
    function pollForResponse(url) {
        return new Promise((resolve, reject) => {
            const interval = setInterval(() => {
                fetch(url)
                    .then(res => {
                        if (res.status === 200) return res.json();
                        if (res.status === 102 || res.status === 204) return null; // Still processing
                        throw new Error("Error inesperado");
                    })
                    .then(data => {
                        if (!data) return;  // sigue esperando
                        clearInterval(interval);
                        resolve(data.answer || data.response);  // adapta según cómo lo devuelvas
                    })
                    .catch(err => {
                        clearInterval(interval);
                        reject(err);
                    });
            }, 1000);  // intenta cada segundo
        });
    }
    </script>
{% endblock %}
